services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-study_planner}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-study_planner}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  auth-service:
    build:
      context: ../..
      dockerfile: deploy/cloud-run/Dockerfile.service
      args:
        SERVICE_PATH: services/auth-service
    restart: unless-stopped
    environment:
      PORT: 3001
      CORS_ORIGIN: ${PUBLIC_APP_URL:-http://localhost:3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-study_planner}
      JWT_SECRET: ${JWT_SECRET:-change_me_for_production}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"

  planner-service:
    build:
      context: ../..
      dockerfile: deploy/cloud-run/Dockerfile.service
      args:
        SERVICE_PATH: services/planner-service
    restart: unless-stopped
    environment:
      PORT: 3002
      CORS_ORIGIN: ${PUBLIC_APP_URL:-http://localhost:3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-study_planner}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3002"

  progress-service:
    build:
      context: ../..
      dockerfile: deploy/cloud-run/Dockerfile.service
      args:
        SERVICE_PATH: services/progress-service
    restart: unless-stopped
    environment:
      PORT: 3003
      CORS_ORIGIN: ${PUBLIC_APP_URL:-http://localhost:3000}
      MONGO_URI: mongodb://mongodb:27017/${MONGO_DB:-study_planner_sessions}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "3003:3003"

  ai-service:
    build:
      context: ../..
      dockerfile: deploy/cloud-run/Dockerfile.service
      args:
        SERVICE_PATH: services/ai-service
    restart: unless-stopped
    environment:
      PORT: 3004
      CORS_ORIGIN: ${PUBLIC_APP_URL:-http://localhost:3000}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    depends_on:
      - ollama
    ports:
      - "3004:3004"

  gateway-service:
    build:
      context: ../..
      dockerfile: deploy/cloud-run/Dockerfile.service
      args:
        SERVICE_PATH: services/gateway-service
    restart: unless-stopped
    environment:
      PORT: 4000
      CORS_ORIGIN: ${PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_SERVICE_URL: http://auth-service:3001
      PLANNER_SERVICE_URL: http://planner-service:3002
      PROGRESS_SERVICE_URL: http://progress-service:3003
      AI_SERVICE_URL: http://ai-service:3004
    depends_on:
      - auth-service
      - planner-service
      - progress-service
      - ai-service
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ../..
      dockerfile: deploy/gcp-vm/Dockerfile.frontend
      args:
        NEXT_PUBLIC_AUTH_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_PROGRESS_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_AI_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_PLANNER_GRAPHQL_URL: ${PUBLIC_API_URL:-http://localhost:4000}/graphql
        NEXT_PUBLIC_WS_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - gateway-service
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  mongodb_data:
  ollama_data: